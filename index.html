<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Projeto Robos </title>

    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/responsivo.css">
    <link rel="stylesheet" href="css/sections.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

    <main class="container-principal">
        <div class="conteudo-principal">
            <h1>PROJETO ROBÔS</h1>

            <img src="./image/desligado.png" alt="robo" id="robo" loading="lazy">
            <div class="caixa-botao">
                <button id="turnOn" class="btn" aria-label="Ligar o robô"> Ligar </button>
                <button id="turnOff" class="btn" aria-label="Desligar o robô"> Desligar </button>
                <button id="reset" class="btn" aria-label="Resetar o robô"> Reset </button>
            </div>
        </div>
    </main>
    <footer class="rodape">
        <div class="rodape-conteudo">
            <p class="rodape-texto">&copy; 2026 Flavio Santana. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
